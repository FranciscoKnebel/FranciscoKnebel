name: Update Profile Metrics

on:
  schedule: [{ cron: '0 6 * * 0' }]
  workflow_dispatch:

permissions:
  contents: read

# Serialize automated writes with publication refreshes.
concurrency:
  group: profile-content-refresh
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Base Summary
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest, pinned for reviewable updates
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base_indepth: yes
          repositories: 400
          repositories_affiliations: owner, collaborator, organization_member

      - name: Calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.plugin.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ''
          plugin_calendar: yes
          plugin_calendar_limit: 1

  metrics-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: metrics
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # latest, pinned for reviewable updates
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit only generated contribution calendars
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -- profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "Generate contribution calendar"
            git push
          fi
