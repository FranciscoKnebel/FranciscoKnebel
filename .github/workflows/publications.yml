name: Update Publications

on:
  schedule:
    - cron: '0 9 * * 6'
  workflow_dispatch:

concurrency:
  group: profile-content-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-scholar.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-scholar.txt

      - name: Verify Scholar imports
        run: python -c "from scholarly import scholarly, ProxyGenerator"

      - name: Test sync failure protection
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Scrape Google Scholar
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/scrape-scholar.py

      - name: Format scraped data
        run: npx prettier --write src/data/publications.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/data/publications.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publications updated:"
            git diff --stat src/data/publications.json
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json
          git commit -m "Update publications from Google Scholar"
          git push
