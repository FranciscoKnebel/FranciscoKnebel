name: Links

on:
  schedule: [{ cron: '0 7 * * 1' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Check links on the live site
        uses: lycheeverse/lychee-action@v2
        with:
          # 403: sites que bloqueiam bots. 999: resposta do LinkedIn para bots.
          args: --verbose --no-progress --max-retries 2 --timeout 20 --accept 200..=299,403,429,999 https://franciscoknebel.com
          fail: true
