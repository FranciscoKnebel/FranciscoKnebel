name: Links

on:
  schedule: [{ cron: '0 7 * * 1' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          # 403: sites que bloqueiam bots. 999: resposta do LinkedIn para bots.
          args: --verbose --no-progress --max-retries 2 --timeout 20 --accept 200..=299,403,429,999 --base https://franciscoknebel.com './dist/**/*.html'
          fail: true
